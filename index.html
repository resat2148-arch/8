<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Urban Scrap: Survivor - scavenge the city, recycle trash into value and survive on your own.">
  <meta name="theme-color" content="#16171b">
  <title>Urban Scrap: Survivor</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="stats"></div>
    <div id="tracker"></div>
    <div id="topc"><div id="clock"></div><div id="district"></div></div>
    <div id="topr">
      <canvas id="minimap" width="150" height="150"></canvas>
      <div id="cash">$0</div>
      <div id="weight"></div>
    </div>
    <div id="quick"></div>
    <div id="menu"></div>
    <div id="toasts"></div>
    <div id="banner"></div>
    <div id="areaName"></div>
    <div id="collect"></div>
  </div>

  <div id="touch" class="hidden">
    <div id="joy" class="hidden"><div id="knob"></div></div>
    <button id="tRun" class="tb">🏃</button>
    <button id="tAtk" class="tb">👊</button>
    <button id="tAct" class="tb big">✋</button>
  </div>

  <div id="panel" class="hidden">
    <div class="pbox">
      <div class="phead"><h2 id="pTitle"></h2><button id="pClose" class="x" data-a="close">✕</button></div>
      <div id="pTabs" class="tabs hidden"></div>
      <div id="pBody"></div>
    </div>
  </div>

  <div id="modal" class="hidden"></div>
  <div id="title" class="hidden"></div>
  <div id="fade"></div>
  <div id="loading"><div class="spin">♻</div><div>URBAN SCRAP</div></div>

  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/world.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/sdk.js"></script>
  <script src="js/input.js"></script>
  <script src="js/game.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
